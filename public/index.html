<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Yard Quest - Discover amazing yard sales near you">
    <title>Yard Quest - Find Your Treasure</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            background: white;
            border-radius: 20px;
            padding: 60px 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 48px;
            color: #333;
            margin-bottom: 16px;
            font-weight: 700;
        }

        .tagline {
            font-size: 20px;
            color: #666;
            margin-bottom: 40px;
        }

        .description {
            font-size: 16px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        .app-badges {
            display: flex;
            gap: 16px;
            justify-content: center;
            align-items: center;
        }

        .app-badges a {
            display: inline-block;
        }

        .badge-ios {
            height: 50px;
        }

        .badge-android {
            height: 75px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 24px;
            }

            h1 {
                font-size: 36px;
            }

            .tagline {
                font-size: 18px;
            }

            .app-badges {
                flex-direction: column;
                gap: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Yard Quest</h1>
        <p class="tagline">Find Your Treasure</p>

        <p class="description">
            Discover amazing yard sales, garage sales, and estate sales near you.
            Turn someone's clutter into your treasure with Yard Quest.
        </p>

        <div class="app-badges">
            <a href="https://apps.apple.com/app/yard-quest" target="_blank" rel="noopener">
                <img src="https://tools.applemediaservices.com/api/badges/download-on-the-app-store/black/en-us?size=250x83"
                     alt="Download on the App Store"
                     class="badge-ios">
            </a>
            <a href="https://play.google.com/store/apps/details?id=com.dakito.yardquest" target="_blank" rel="noopener">
                <img src="https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png"
                     alt="Get it on Google Play"
                     class="badge-android">
            </a>
        </div>
    </div>
</body>
</html>
