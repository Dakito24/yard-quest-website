<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Yard Quest - Discover amazing yard sales near you">
    <title>Yard Quest - Find Your Treasure</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            background: white;
            border-radius: 20px;
            padding: 60px 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .title-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            margin-bottom: 16px;
        }

        .logo {
            width: 60px;
            height: 60px;
        }

        h1 {
            font-size: 48px;
            color: #333;
            font-weight: 700;
            margin: 0;
        }

        .tagline {
            font-size: 20px;
            color: #666;
            margin-bottom: 40px;
        }

        .description {
            font-size: 16px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        .coming-soon {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px 48px;
            border-radius: 50px;
            font-size: 24px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 24px;
            }

            .title-section {
                gap: 6px;
            }

            .logo {
                width: 48px;
                height: 48px;
            }

            h1 {
                font-size: 36px;
            }

            .tagline {
                font-size: 18px;
            }

            .coming-soon {
                font-size: 20px;
                padding: 14px 36px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="title-section">
            <h1>Yard Quest</h1>
            <img src="/logo.png" alt="Yard Quest Logo" class="logo">
        </div>
        <p class="tagline">Find Your Treasure</p>

        <p class="description">
            Discover amazing yard sales, garage sales, and estate sales near you.
            Turn someone's clutter into your treasure with Yard Quest.
        </p>

        <div class="coming-soon">Coming Soon</div>
    </div>
</body>

</html>
