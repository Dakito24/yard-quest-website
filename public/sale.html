<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View this yard sale in the Yard Quest app">
    <title>Yard Sale - Yard Quest</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            background: white;
            border-radius: 20px;
            padding: 48px 32px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .logo {
            font-size: 64px;
            margin-bottom: 20px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 32px;
            color: #333;
            margin-bottom: 16px;
            font-weight: 700;
        }

        .message {
            font-size: 16px;
            color: #666;
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .loading {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .app-badges {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 32px;
        }

        .badge {
            height: 50px;
        }

        .divider {
            margin: 32px 0;
            border-top: 1px solid #eee;
        }

        .back-link {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            margin-top: 24px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .container {
                padding: 36px 24px;
            }

            h1 {
                font-size: 28px;
            }

            .logo {
                font-size: 48px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🏠</div>
        <h1 id="title">Opening Yard Quest...</h1>
        <div class="loading" id="loading"></div>
        <p class="message" id="message">
            Attempting to open this sale in the Yard Quest app...
        </p>

        <div id="fallback" style="display: none;">
            <div class="divider"></div>
            <p class="message">
                Don't have the Yard Quest app? Download it now to view this sale and discover many more!
            </p>
            <div class="app-badges">
                <a href="https://apps.apple.com/app/yard-quest" target="_blank" rel="noopener">
                    <img src="https://tools.applemediaservices.com/api/badges/download-on-the-app-store/black/en-us?size=250x83"
                         alt="Download on the App Store"
                         class="badge">
                </a>
                <a href="https://play.google.com/store/apps/details?id=com.dakito.yardquest" target="_blank" rel="noopener">
                    <img src="https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png"
                         alt="Get it on Google Play"
                         class="badge"
                         style="height: 75px;">
                </a>
            </div>
            <a href="/" class="back-link">← Back to Home</a>
        </div>
    </div>

    <script>
        // Get sale ID from URL
        const pathParts = window.location.pathname.split('/');
        const saleId = pathParts[pathParts.length - 1];

        // Attempt to open the app via deep link
        // The deep link will be handled by iOS Universal Links or Android App Links
        // If the app is installed, it will open automatically
        // If not, we'll show the fallback after a timeout

        // Show fallback after 3 seconds if app doesn't open
        const fallbackTimeout = setTimeout(() => {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('title').textContent = 'Get the Yard Quest App';
            document.getElementById('message').textContent =
                'To view this sale and discover amazing yard sales near you, download the Yard Quest app.';
            document.getElementById('fallback').style.display = 'block';
        }, 3000);

        // If the page is hidden (app opened), clear the timeout
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                clearTimeout(fallbackTimeout);
            }
        });

        // Check if page becomes hidden (indicates app opened)
        window.addEventListener('blur', () => {
            clearTimeout(fallbackTimeout);
        });
    </script>
</body>
</html>
