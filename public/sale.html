<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View this yard sale in the Yard Quest app">
    <title>Yard Sale - Yard Quest</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            background: white;
            border-radius: 20px;
            padding: 60px 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .title-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            margin-bottom: 16px;
        }

        .logo {
            width: 60px;
            height: 60px;
        }

        h1 {
            font-size: 48px;
            color: #333;
            font-weight: 700;
            margin: 0;
        }

        .tagline {
            font-size: 20px;
            color: #666;
            margin-bottom: 40px;
        }

        .message {
            font-size: 16px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .loading {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .coming-soon {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px 48px;
            border-radius: 50px;
            font-size: 24px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 24px;
            }

            .title-section {
                gap: 6px;
            }

            .logo {
                width: 48px;
                height: 48px;
            }

            h1 {
                font-size: 36px;
            }

            .tagline {
                font-size: 18px;
            }

            .coming-soon {
                font-size: 20px;
                padding: 14px 36px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="title-section">
            <h1>Yard Quest</h1>
            <img src="/logo.png" alt="Yard Quest Logo" class="logo">
        </div>
        <p class="tagline" id="tagline">Opening sale...</p>

        <div class="loading" id="loading"></div>

        <p class="message" id="message">
            Attempting to open this sale in the Yard Quest app...
        </p>

        <div id="fallback" style="display: none;">
            <div class="coming-soon">Coming Soon</div>
        </div>
    </div>

    <script>
        // Get sale ID from URL
        const pathParts = window.location.pathname.split('/');
        const saleId = pathParts[pathParts.length - 1];

        // Attempt to open the app via deep link
        // The deep link will be handled by iOS Universal Links or Android App Links
        // If the app is installed, it will open automatically
        // If not, we'll show the fallback after a timeout

        // Show fallback after 3 seconds if app doesn't open
        const fallbackTimeout = setTimeout(() => {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('tagline').textContent = 'App Coming Soon';
            document.getElementById('message').textContent =
                'The Yard Quest app will be available soon. Check back later to view this sale and discover amazing yard sales near you!';
            document.getElementById('fallback').style.display = 'block';
        }, 3000);

        // If the page is hidden (app opened), clear the timeout
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                clearTimeout(fallbackTimeout);
            }
        });

        // Check if page becomes hidden (indicates app opened)
        window.addEventListener('blur', () => {
            clearTimeout(fallbackTimeout);
        });
    </script>
</body>

</html>
